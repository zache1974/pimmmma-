<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIMA</title>
 
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
 
body{
font-family:Arial, sans-serif;
background:linear-gradient(135deg, #4f46e5, #06b6d4);
color:white;
text-align:center;
}
 
header{
padding:80px 20px;
}
 
h1{
font-size:70px;
text-shadow:3px 3px 10px black;
}
 
p{
font-size:22px;
margin-top:10px;
}
 
button{
margin-top:30px;
padding:15px 30px;
font-size:20px;
border:none;
border-radius:10px;
background:white;
color:#4f46e5;
cursor:pointer;
transition:0.3s;
}
 
button:hover{
transform:scale(1.1);
}
 
section{
padding:50px 20px;
}
 
.card{
background:rgba(255,255,255,0.2);
margin:20px auto;
max-width:500px;
padding:20px;
border-radius:15px;
}
 
footer{
padding:20px;
background:rgba(0,0,0,0.2);
}
</style>
 
</head>
<body>
 
<header>
<h1>PIMA</h1>
<p>Välkommen till den coolaste hemsidan!</p>
<button onclick="alert('Välkommen till PIMA! 🚀')">Klicka här</button>
</header>
 
<section>
<div class="card">
<h2>🔥 Snabb</h2>
<p>PIMA är modern, enkel och snygg.</p>
</div>
 
<div class="card">
<h2>💎 Cool Design</h2>
<p>Färger och effekter som sticker ut.</p>
</div>
 
<div class="card">
<h2>🚀 Framtiden</h2>
<p>Bygg vad du vill med PIMA.</p>
</div>
</section>
 
<footer>
<p>© 2026 PIMA</p>
</footer>
 
</body>
</html>
